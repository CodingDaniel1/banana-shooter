name: Setup Unity Build
description: Setup git/lfs/restore and library cache before building player

runs:
  using: composite
  steps:
    # Git LFS
    - name: Create LFS file list
      run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

    - name: Restore LFS cache
      uses: actions/cache@v4
      id: lfs-cache
      with:
        path: .git/lfs
        key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}

    - name: Git LFS Pull
      run: |
        git lfs pull
        git add .
        git reset --hard

    - name: Compute version
      id: version
      shell: bash
      run: |
        if [[ "${{ inputs.version_scheme }}" == "nightly" ]]; then
          BASE=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "v0.0.0")
          BASE=${BASE#v}
          DATE=$(date +'%Y%m%d')
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "versioning=Custom" >> "$GITHUB_OUTPUT"
          echo "version=${BASE}-nightly.${DATE}.${SHA}" >> "$GITHUB_OUTPUT"
        else
          echo "versioning=Semantic" >> "$GITHUB_OUTPUT"
          echo "version=" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore Unlicensed Assets
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      run: |
          bsubp restore 2026-10-13T09-37-48Z -c

    - name: Cache library
      uses: actions/cache@v4
      with:
        path: Library
        key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
        restore-keys: |
          Library-${{ matrix.targetPlatform }}-
          Library-
