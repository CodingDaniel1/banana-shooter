# This is intended as an automation for deploying updates, but since it's using secrets everywhere, forked repos can't run this workflow

on:
  workflow_call:
    inputs:
      # 'nightly' or 'semantic'
      version_scheme:
        required: true
        type: string
      build_description:
        required: true
        type: string
    secrets:
      UNITY_LICENSE: { required: true }
      UNITY_EMAIL: { required: true }
      UNITY_PASSWORD: { required: true }
      R2_ACCESS_KEY_ID: { required: true }
      R2_ACCOUNT_ID: { required: true }
      R2_SECRET_ACCESS_KEY: { required: true }
      STEAM_USERNAME: { required: true }
      STEAM_CONFIG_VDF: { required: true }

jobs:
  build:
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-2022
            targetPlatform: StandaloneWindows64
          - os: ubuntu-latest
            targetPlatform: StandaloneLinux64

    steps:
      - uses: ./.github/actions/setup-build

      - name: Build Server
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          unityVersion: 2021.3.45f2
          versioning: ${{ steps.version.outputs.versioning }}
          version: ${{ steps.version.outputs.version }}
          buildName: Banana Shooter Dedicated Server
          buildPath: build-server
          customParameters: -standaloneBuildSubtarget Server

      - name: Remove IL2CPP/Burst debug directories
        shell: bash
        run: |
          SUDO=""
          if [ "${{ runner.os }}" = "Linux" ]; then SUDO="sudo"; fi

          $SUDO find build-server -type d \( \
            -name '*_BackUpThisFolder_ButDontShipItWithYourGame' -o \
            -name '*_BurstDebugInformation_DoNotShip' \
          \) -prune -exec rm -rf {} +

          if [ -n "$SUDO" ]; then
            $SUDO chown -R "$(id -u):$(id -g)" build-server
          fi

          echo "Remaining build contents:"
          find build-server -maxdepth 2 -type d

      - name: Stage Server
        shell: bash
        run: |
          mkdir -p artifacts/server
          mv build-server/${{ matrix.targetPlatform }} artifacts/server/

      - name: Build Client
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          unityVersion: 2021.3.45f2
          versioning: ${{ steps.version.outputs.versioning }}
          version: ${{ steps.version.outputs.version }}
          buildName: Banana Shooter

      - name: Remove IL2CPP/Burst debug directories
        shell: bash
        run: |
          SUDO=""
          if [ "${{ runner.os }}" = "Linux" ]; then SUDO="sudo"; fi

          $SUDO find build -type d \( \
            -name '*_BackUpThisFolder_ButDontShipItWithYourGame' -o \
            -name '*_BurstDebugInformation_DoNotShip' \
          \) -prune -exec rm -rf {} +

          if [ -n "$SUDO" ]; then
            $SUDO chown -R "$(id -u):$(id -g)" build
          fi

          echo "Remaining build contents:"
          find build -maxdepth 2 -type d

      - name: Stage Client
        shell: bash
        run: |
          mkdir -p artifacts/client
          mv build/${{ matrix.targetPlatform }} artifacts/client/

      - name: Upload Build Client
        uses: actions/upload-artifact@v4
        with:
          name: Client-${{ matrix.targetPlatform }}
          path: artifacts/client
          retention-days: 1

      - name: Upload Build Server
        uses: actions/upload-artifact@v4
        with:
          name: Server-${{ matrix.targetPlatform }}
          path: artifacts/server
          retention-days: 1

  deploy:
    name: Deploy to Steam
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
    - name: Download Windows Client
      uses: actions/download-artifact@v4
      with:
        name: Client-StandaloneWindows64
        path: client/StandaloneWindows64

    - name: Download Linux Client
      uses: actions/download-artifact@v4
      with:
        name: Client-StandaloneLinux64
        path: client/StandaloneLinux64

    - name: Download Windows Server
      uses: actions/download-artifact@v4
      with:
        name: Server-StandaloneWindows64
        path: server/StandaloneWindows64

    - name: Download Linux Server
      uses: actions/download-artifact@v4
      with:
        name: Server-StandaloneLinux64
        path: server/StandaloneLinux64

    - name: Deploy Client to Steam
      uses: game-ci/steam-deploy@v3
      with:
        username: ${{ secrets.STEAM_USERNAME }}
        configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
        appId: 1949740
        buildDescription: ${{ inputs.build_description }}
        rootPath: client
        depot1Path: StandaloneWindows64
        depot2Path: StandaloneLinux64
        releaseBranch: nightly

    - name: Deploy Server to Steam
      uses: game-ci/steam-deploy@v3
      with:
        username: ${{ secrets.STEAM_USERNAME }}
        configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
        appId: 2406780
        buildDescription: ${{ inputs.build_description }}
        rootPath: server
        depot1Path: StandaloneWindows64
        depot2Path: StandaloneLinux64
        releaseBranch: nightly

    - name: Delete artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.runId,
          });
          for (const artifact of artifacts.data.artifacts) {
            await github.rest.actions.deleteArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
            });
          }
